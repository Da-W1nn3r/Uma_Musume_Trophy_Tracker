<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Trophy CV browser test</title>
</head>
<body>
<!--
  Runs trophy-cv.js through the real browser path (Image -> canvas ->
  getImageData) on every labelled screenshot in CV/, to catch any
  difference from the Node decoder (e.g. canvas colour management).
  Serve the repo root over http and open /tools/browser-test.html.
-->
<pre id="out">running...</pre>
<script src="../trophy-cv.js"></script>
<script>
const FILES = {
  'CV/Completed_dataset': ['214709', '214711', '214712', '214714', '214715', '214717',
    '214718', '214720', '214721', '214722', '214724', '214725'].map(s => `Screenshot_20261105-${s}.png`),
  'CV/Incomplete_dataset': ['214637', '214639', '214641', '214642', '214644', '214646',
    '214647', '214649', '214651', '214652', '214654', '214655'].map(s => `Screenshot_20261105-${s}.png`),
  'CV/Test_dataset': ['215543', '215551', '215557', '215602', '215606', '215611',
    '215616', '215619', '215625', '215629', '215639', '215646'].map(s => `Screenshot 2026-11-05 ${s}.png`),
};

function load(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);
      resolve(ctx.getImageData(0, 0, c.width, c.height));
    };
    img.onerror = reject;
    img.src = url;
  });
}

(async () => {
  const layout = await (await fetch('../data/trophy-room.json')).json();
  const answer = new Set((await (await fetch('../CV/Test_dataset/answer.json')).json()).completed);
  const truth = {
    'CV/Completed_dataset': () => true,
    'CV/Incomplete_dataset': () => false,
    'CV/Test_dataset': id => answer.has(id),
  };
  let total = 0, wrong = 0, failed = 0, minWon = 1, maxLost = 0;
  const lines = [];
  for (const [dir, files] of Object.entries(FILES)) {
    for (const f of files) {
      const res = TrophyCV.analyzeTrophyScreenshot(await load(`../${dir}/${encodeURIComponent(f)}`), layout);
      if (!res.ok) { failed++; lines.push(`FAIL ${dir}/${f}: ${res.error}`); continue; }
      for (const s of res.slots) {
        if (s.raceId === null) continue;
        total++;
        const exp = truth[dir](s.raceId);
        if (exp) minWon = Math.min(minWon, s.score); else maxLost = Math.max(maxLost, s.score);
        if (s.won !== exp) { wrong++; lines.push(`ERR ${dir}/${f} race ${s.raceId}`); }
      }
    }
  }
  lines.push(`RESULT ${total - wrong}/${total} slots correct, ${failed} images failed, ` +
    `min won ${minWon.toFixed(3)}, max not-won ${maxLost.toFixed(3)}`);
  document.getElementById('out').textContent = lines.join('\n');
})().catch(e => { document.getElementById('out').textContent = 'ERROR ' + e; });
</script>
</body>
</html>
