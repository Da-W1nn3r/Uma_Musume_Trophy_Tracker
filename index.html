<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Uma Musume Trophy Tracker</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Uma Musume Trophy Tracker</h1>
    <div class="progress" id="progress">Loading races...</div>
  </header>

  <nav class="controls">
    <div class="view-toggle">
      <button class="view-btn active" data-view="calendar">Calendar</button>
      <button class="view-btn" data-view="list">List</button>
      <button class="view-btn" data-view="trophy">Trophy Room</button>
    </div>

    <div class="search-wrap">
      <input type="search" id="search-input" placeholder="Search race, track, distance..." />
    </div>

    <div class="filters" id="grade-filters">
      <label><input type="checkbox" class="grade-filter" value="G1" checked /> G1</label>
      <label><input type="checkbox" class="grade-filter" value="G2" checked /> G2</label>
      <label><input type="checkbox" class="grade-filter" value="G3" checked /> G3</label>
    </div>

    <div class="save-controls">
      <button id="scan-btn" title="Detect won trophies from in-game Trophy Room screenshots">Scan screenshots</button>
      <input type="file" id="scan-file" accept="image/*" multiple hidden />
      <button id="export-btn" title="Download your checklist as a JSON file">Export</button>
      <button id="import-btn" title="Load a previously exported checklist">Import</button>
      <input type="file" id="import-file" accept="application/json" hidden />
      <button id="clear-btn" class="danger" title="Uncheck every race">Clear</button>
    </div>
  </nav>

  <main id="app">
    <section id="calendar-view" class="view-panel">
      <div class="year-tabs" id="year-tabs">
        <button class="year-tab active" data-year="1">Junior Year</button>
        <button class="year-tab" data-year="2">Classic Year</button>
        <button class="year-tab" data-year="3">Senior Year</button>
      </div>
      <div class="calendar-grid" id="calendar-grid"></div>
    </section>

    <section id="list-view" class="view-panel hidden">
      <div class="list-container" id="list-container"></div>
    </section>

    <section id="trophy-view" class="view-panel hidden">
      <div class="trophy-tabs" id="trophy-tabs">
        <button class="trophy-tab active" data-grade="G1">G1</button>
        <button class="trophy-tab" data-grade="G2">G2</button>
        <button class="trophy-tab" data-grade="G3">G3</button>
      </div>
      <div class="trophy-pager">
        <button id="trophy-prev" class="page-nav-btn" aria-label="Previous page">&larr;</button>
        <span class="trophy-page-label" id="trophy-page-label"></span>
        <button id="trophy-next" class="page-nav-btn" aria-label="Next page">&rarr;</button>
      </div>
      <div class="trophy-page" id="trophy-page"></div>
    </section>
  </main>

  <div class="celebration-overlay hidden" id="celebration-overlay">
    <div class="celebration-banner">🏆 Trophy Room Complete! 🏆</div>
  </div>

  <dialog class="scan-dialog" id="scan-dialog">
    <div class="scan-head">
      <h2>Import from screenshots</h2>
      <button type="button" class="scan-close" id="scan-close" aria-label="Close">&times;</button>
    </div>
    <p class="scan-hint">
      Take a screenshot of each Trophy Room page in the game (keep the row of
      page dots under the shelves visible). Images are processed on this
      device only. Click a trophy below to correct a detection.
    </p>
    <div class="scan-results" id="scan-results"></div>
    <div class="scan-foot">
      <span class="scan-summary" id="scan-summary"></span>
      <label class="scan-option">
        <input type="checkbox" id="scan-uncheck" />
        Also uncheck trophies shown as not won
      </label>
      <button type="button" id="scan-more">Add more</button>
      <button type="button" class="primary" id="scan-apply">Apply</button>
    </div>
  </dialog>

  <script src="trophy-cv.js"></script>
  <script src="scan-ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
